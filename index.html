<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Curious!</title>
  <!-- UI用 Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 id="home-logo" class="text-2xl font-bold flex items-center gap-2 cursor-pointer hover:opacity-90 transition">
      🦉 Stay Curious!
    </h1>
    <div id="user-status" class="hidden flex items-center gap-4">
      <span id="user-email" class="text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
      <button id="logout-btn" type="button" class="bg-rose-500 hover:bg-rose-600 px-3 py-1 rounded text-sm font-semibold transition">ログアウト</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">

    <!-- 1. 認証画面（未ログイン時） -->
    <section id="auth-section" class="bg-white p-6 rounded-xl shadow-md max-w-md mx-auto mt-12">
      <h2 class="text-xl font-bold mb-4 text-center">ログイン / 新規登録</h2>
      <p id="share-login-notice" class="hidden text-xs bg-indigo-50 text-indigo-700 p-3 rounded-lg mb-4 text-center">
        共有された単語帳を開くには、ログインまたは新規登録を行ってください。
      </p>
      <form id="auth-form" class="space-y-4" onsubmit="return false;">
        <div>
          <label for="auth-email" class="block text-sm font-medium mb-1">メールアドレス</label>
          <input type="email" id="auth-email" autocomplete="email" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="example@email.com">
        </div>
        <div>
          <label for="auth-password" class="block text-sm font-medium mb-1">パスワード</label>
          <input type="password" id="auth-password" autocomplete="current-password" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
        </div>
        <div class="flex gap-2 pt-2">
          <button id="login-btn" type="button" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded font-semibold transition">ログイン</button>
          <button id="signup-btn" type="button" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded font-semibold transition">新規登録</button>
        </div>
      </form>
    </section>

    <!-- 2. ダッシュボード（ログイン後画面） -->
    <section id="dashboard-section" class="hidden space-y-8">
      <!-- 新規単語帳作成 -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold mb-4">新しい単語帳を作成</h2>
        <form id="create-deck-form" class="grid grid-cols-1 md:grid-cols-3 gap-4" onsubmit="return false;">
          <input type="text" id="deck-title" class="border rounded p-2" placeholder="単語帳タイトル (例: ターゲット1900)">
          <input type="text" id="textbook-name" class="border rounded p-2" placeholder="教科書名 (任意)">
          <button id="create-deck-btn" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded transition">作成する</button>
        </form>
      </div>

      <!-- マイ単語帳一覧 -->
      <div>
        <h2 class="text-xl font-bold mb-4">マイ単語帳一覧</h2>
        <div id="decks-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- JSから動的に挿入 -->
        </div>
      </div>

      <!-- 全体公開されている単語帳一覧 -->
      <div>
        <h2 class="text-xl font-bold mb-4">🌐 公開されているみんなの単語帳</h2>
        <div id="public-decks-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- JSから動的に挿入 -->
        </div>
      </div>
    </section>

    <!-- 3. 単語帳詳細 & カード作成・一覧画面 -->
    <section id="deck-detail-section" class="hidden space-y-6">
      <div class="bg-white p-5 rounded-xl shadow-md space-y-4">
        <div class="flex flex-wrap justify-between items-start gap-4">
          <div>
            <button id="back-to-dashboard-btn" type="button" class="text-sm text-indigo-600 hover:underline font-medium mb-1">← 単語帳一覧に戻る</button>
            <div class="flex items-center gap-2">
              <h2 id="detail-deck-title" class="text-2xl font-bold text-slate-800"></h2>
              <span id="shared-deck-badge" class="hidden text-xs font-bold px-2.5 py-0.5 rounded bg-amber-100 text-amber-800">共有単語帳（閲覧・学習のみ）</span>
            </div>
            <p id="detail-deck-textbook" class="text-xs text-indigo-600 font-semibold mt-1"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="start-weak-study-btn" type="button" class="bg-rose-500 hover:bg-rose-600 disabled:bg-slate-200 disabled:text-slate-400 text-white px-4 py-3 rounded-xl font-bold shadow-sm transition">
              🔥 苦手だけ復習 (<span id="weak-cards-count">0</span>)
            </button>
            <button id="start-study-btn" type="button" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-bold shadow transition">
              ▶ 全問学習
            </button>
          </div>
        </div>

        <!-- 共有設定パネル（オーナーのみ表示） -->
        <div id="share-settings-panel" class="hidden bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <label for="deck-visibility-select" class="text-xs font-bold text-slate-600">公開設定:</label>
            <select id="deck-visibility-select" class="border rounded-lg px-2.5 py-1.5 text-xs bg-white font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="private">🔒 非公開（自分のみ）</option>
              <option value="link">🔗 リンクを知っている人のみ</option>
              <option value="public">🌐 全体公開（一覧に表示）</option>
            </select>
          </div>
          <div id="share-link-box" class="hidden flex items-center gap-2">
            <input type="text" id="share-url-input" readonly class="text-xs bg-white border rounded-lg px-2.5 py-1.5 w-48 md:w-64 text-slate-500">
            <button id="copy-share-url-btn" type="button" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
              🔗 URLをコピー
            </button>
          </div>
        </div>

        <!-- 学習成績サマリー -->
        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-slate-100 text-center">
          <div class="bg-slate-50 p-2.5 rounded-lg">
            <p class="text-xs text-slate-500">登録カード</p>
            <p id="stat-total-cards" class="text-lg font-bold text-slate-800">0枚</p>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-lg">
            <p class="text-xs text-slate-500">自分の正答率</p>
            <p id="stat-accuracy-rate" class="text-lg font-bold text-indigo-600">--%</p>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-lg">
            <p class="text-xs text-slate-500">要復習（苦手）</p>
            <p id="stat-weak-cards" class="text-lg font-bold text-rose-600">0枚</p>
          </div>
        </div>
      </div>

      <!-- カード新規作成フォーム（オーナーのみ表示） -->
      <div id="create-card-container" class="bg-white p-6 rounded-xl shadow-md space-y-4">
        <h3 class="text-lg font-bold text-slate-800">問題カードを追加</h3>

        <!-- 4種類のカード形式選択 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <button type="button" data-card-type="basic" class="card-type-tab bg-indigo-600 text-white py-2 px-3 rounded-lg text-sm font-semibold transition">一問一答</button>
          <button type="button" data-card-type="order" class="card-type-tab bg-slate-100 text-slate-700 hover:bg-slate-200 py-2 px-3 rounded-lg text-sm font-semibold transition">並べ替え</button>
          <button type="button" data-card-type="multi_element" class="card-type-tab bg-slate-100 text-slate-700 hover:bg-slate-200 py-2 px-3 rounded-lg text-sm font-semibold transition">複数要素（完答）</button>
          <button type="button" data-card-type="cloze" class="card-type-tab bg-slate-100 text-slate-700 hover:bg-slate-200 py-2 px-3 rounded-lg text-sm font-semibold transition">穴埋め</button>
        </div>

        <!-- 動的フォームエリア -->
        <form id="create-card-form" class="space-y-4" onsubmit="return false;">
          <div id="dynamic-card-fields" class="space-y-3">
            <!-- JSでカードタイプに応じた入力欄を描画 -->
          </div>

          <!-- メタ情報（ページ・問題番号） -->
          <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
            <div>
              <label class="block text-xs text-slate-500 mb-1">ページ番号 (任意)</label>
              <input type="number" id="card-page-number" min="0" class="w-full border rounded p-2 text-sm" placeholder="例: 42">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">問題番号 (任意)</label>
              <input type="text" id="card-question-number" class="w-full border rounded p-2 text-sm" placeholder="例: 問3-(2)">
            </div>
          </div>

          <button id="create-card-btn" type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
            このカードを追加する
          </button>
        </form>
      </div>

      <!-- 登録済みカード一覧 -->
      <div>
        <h3 class="text-lg font-bold mb-3">登録済みカード (<span id="cards-count">0</span>枚)</h3>
        <div id="cards-list" class="space-y-3">
          <!-- JSから動的に挿入 -->
        </div>
      </div>
    </section>

    <!-- 4. 学習（クイズ）画面 -->
    <section id="study-section" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
        <button id="exit-study-btn" type="button" class="text-sm text-slate-600 hover:text-slate-900 font-medium">✕ 学習を終了する</button>
        <div class="flex items-center gap-2">
          <span id="study-mode-badge" class="text-xs font-bold px-2.5 py-0.5 rounded bg-indigo-100 text-indigo-700">全問モード</span>
          <span class="text-sm font-bold text-indigo-600">
            問題 <span id="study-progress">1 / 1</span>
          </span>
        </div>
      </div>

      <!-- 問題カード本体 -->
      <div id="study-card-container" class="bg-white p-6 md:p-8 rounded-2xl shadow-md min-h-[280px] flex flex-col justify-between">
        <!-- JSでカード種類ごとの出題UIを描画 -->
      </div>
    </section>

  </main>

  <!-- スクリプト参照 -->
  <script src="app.js" defer></script>
</body>
</html>
